name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check teaching model and Blender export
        run: node --experimental-strip-types scripts/check-bridge.mjs

      - name: Check Tinkercad course and printable tower
        run: node --experimental-strip-types scripts/check-tower.mjs

      - name: Check A2 district design dimensions and constraints
        run: node scripts/check-district.cjs

      - name: Check Google school account validation
        run: node --experimental-strip-types scripts/check-google-auth.mjs

      - name: Build static site
        # Both language versions must remain complete.
        run: node scripts/check-i18n.cjs && npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /yuen-long-urban-studio
          # Set the repository variable GOOGLE_CLIENT_ID to the Web OAuth
          # client ID from Google Cloud Console. Client IDs are public by design.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - name: Prepare Pages routes and assets
        run: node scripts/prepare-pages.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
